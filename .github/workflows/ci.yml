name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, types, unit tests & retrieval gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff (lint + import order)
        run: ruff check .
      - name: Mypy (types)
        run: mypy src
      - name: Unit tests
        run: pytest -q tests
      # Runs on every push: no judge model, no key, no spend. Scores retrieval
      # against a fixed labelled corpus, so the repo has a real quality gate
      # even when the paid DeepEval suite below is unavailable.
      - name: Retrieval quality gate (recall@k / MRR, key-free)
        run: pytest -q evals/test_retrieval.py

  # Publishes the measured numbers so the README badges cannot drift from the
  # gate. Only on a real push to main - PRs from forks have no write token, and
  # a PR should not move the published figures anyway.
  publish-metrics:
    name: Publish eval metrics
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Measure
        run: python evals/report.py "$RUNNER_TEMP/metrics"

      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin gh-pages
          git worktree add "$RUNNER_TEMP/pages" origin/gh-pages
          mkdir -p "$RUNNER_TEMP/pages/metrics"
          cp "$RUNNER_TEMP/metrics"/*.json "$RUNNER_TEMP/pages/metrics/"
          cd "$RUNNER_TEMP/pages"
          if git diff --quiet; then
            echo "metrics unchanged"
            exit 0
          fi
          git add metrics
          git commit -m "chore(metrics): publish retrieval scores from ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages

  # Whether a judge key is configured. `secrets` cannot be read from a job-level
  # `if:`, so it is surfaced here as an output.
  judge-key:
    name: Judge key configured?
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: echo "present=${{ env.OPENAI_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

  evals:
    name: Answer quality gate (DeepEval, needs judge key)
    runs-on: ubuntu-latest
    needs: [test, judge-key]
    # Gated at job level so an unconfigured repo reports this as SKIPPED (grey)
    # rather than a green check that ran nothing.
    if: needs.judge-key.outputs.present == 'true'
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,evals]"
      - name: Build index
        run: ask-santosh-ingest
      - name: DeepEval suite (faithfulness / answer-relevancy / contextual-relevancy)
        run: deepeval test run evals/test_rag.py
