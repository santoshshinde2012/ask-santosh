name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Ruff (lint + import order)
        run: ruff check .
      - name: Mypy (types)
        run: mypy src
      - name: Unit tests (no API key required)
        run: pytest -q

  evals:
    name: RAG quality gate (DeepEval)
    runs-on: ubuntu-latest
    needs: test
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect judge key
        id: key
        run: echo "present=${{ env.OPENAI_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.key.outputs.present == 'false'
        run: echo "::notice::OPENAI_API_KEY not set — skipping RAG evals. Add it in Settings › Secrets to enable the quality gate."
      - if: steps.key.outputs.present == 'true'
        run: pip install -e ".[dev,evals]"
      - if: steps.key.outputs.present == 'true'
        name: Build index
        run: ask-santosh-ingest
      - if: steps.key.outputs.present == 'true'
        name: Run DeepEval suite
        run: deepeval test run evals/test_rag.py
