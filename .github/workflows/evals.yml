name: RAG Evals

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Keep the badge green when no judge key is configured yet.
      - name: Check for API key
        id: key
        run: echo "present=${{ env.OPENAI_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - if: steps.key.outputs.present == 'false'
        run: echo "::notice::OPENAI_API_KEY not set — skipping the eval run. Add it in repo Settings › Secrets to enable the RAG quality gate."

      - if: steps.key.outputs.present == 'true'
        run: pip install -r requirements.txt
      - if: steps.key.outputs.present == 'true'
        name: Build index
        run: python -m src.ingest
      - if: steps.key.outputs.present == 'true'
        name: Run DeepEval suite
        run: deepeval test run evals/test_rag.py
